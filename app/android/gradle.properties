# Sized for a 4 GB development machine (the Flutter template default of -Xmx8G
# makes the Gradle JVM crash with "insufficient memory"). Raise these on a
# bigger machine if builds feel slow.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024M
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# QR scanning: use the Google Play Services model (keeps the APK ~2 MB smaller).
dev.steenbakker.mobile_scanner.useUnbundled=true
