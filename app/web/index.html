<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    The base path the app is served from. `flutter build web --base-href`
    fills this in (/godoctor/app/ on GitHub Pages; "/" when run locally).
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="See a doctor or order medicine, wherever you are.">
  <meta name="theme-color" content="#0B1730">

  <!-- Added to an iPhone or iPad's Home Screen: full screen, its own name and icon. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GoDoctor">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>GoDoctor</title>
  <link rel="manifest" href="manifest.json">

  <!--
    While the app downloads: the GoDoctor icon on the same navy as the launch
    animation, and a quiet progress line. Removed when the app draws its
    first frame.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B1730; }
    #loading {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #0B1730; transition: opacity .35s ease;
    }
    #loading img {
      width: 96px; height: 96px; border-radius: 23px;
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
      animation: breathe 2.4s ease-in-out infinite;
    }
    #loading .bar {
      width: 120px; height: 3px; margin-top: 34px; border-radius: 3px;
      background: rgba(255,255,255,.12); overflow: hidden;
    }
    #loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 3px;
      background: #1B63F2; animation: slide 1.2s ease-in-out infinite;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    @keyframes breathe { 50% { transform: scale(1.05); } }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #loading img, #loading .bar::after { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" aria-label="GoDoctor is loading" role="img">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      // The page colour behind the app (round the iPhone's notch and home
      // bar) matches the app's own background from here on.
      document.documentElement.style.background = '#F5F8FF';
      document.body.style.background = '#F5F8FF';
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('done');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
