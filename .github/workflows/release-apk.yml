# Builds the signed Android APK on GitHub's machines and publishes it as a
# GitHub Release. The download page (website/, GitHub Pages) always offers
# the latest release's .apk; afterwards this starts website.yml, which
# publishes the same version for iOS (the app on the web, at /app/).
#
# Each release also carries version.json, which the installed app reads
# (releases/latest/download/version.json) to offer the update in-app. Its
# "What's new" list comes from app/release_notes/<version>.txt if it exists,
# otherwise from the commit subjects since the previous tag.
#
# Release a version either way:
#   git tag v1.0.1 && git push origin v1.0.1
#   or: GitHub > Actions > "Release Android APK" > Run workflow (enter 1.0.1)
#
# Repository secrets used:
#   APP_ENV                    contents of app/.env (Supabase URL + anon key)
#   ANDROID_KEYSTORE_BASE64    secrets/godoctor-release.jks, base64
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key)
name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.0.1'
        required: true

permissions:
  contents: write
  actions: write   # to start website.yml after the release

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # tags + history, for the "What's new" notes

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Work out the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building GoDoctor $V (build ${{ github.run_number }})"

      - name: App configuration (.env)
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          test -n "$APP_ENV" || { echo "APP_ENV secret is missing"; exit 1; }
          printf '%s\n' "$APP_ENV" > .env

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=godoctor"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Give Gradle more memory (the repo is tuned for a 4 GB laptop)
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties

      - run: flutter pub get

      - name: Build APKs
        # One APK per phone type, so each phone downloads only its own code:
        # 64-bit ARM (nearly every phone) and 32-bit ARM (older ones). Their
        # versionCodes get the type in front (2000 + n, 1000 + n); the app
        # compares only the release number (n).
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm,android-arm64
          --build-name=${{ steps.v.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Name the files
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "GoDoctor-${{ steps.v.outputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "GoDoctor-${{ steps.v.outputs.version }}-32bit.apk"
          ls -la GoDoctor-*.apk

      - name: Version file for in-app updates
        env:
          V: ${{ steps.v.outputs.version }}
          BUILD: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s "release_notes/$V.txt" ]; then
            grep -v '^[[:space:]]*$' "release_notes/$V.txt" | head -10 > notes.txt
          else
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
            RANGE="${PREV:+$PREV..}${GITHUB_SHA}"
            git log --no-merges --pretty=format:'%s' "$RANGE" | grep -v '^Version ' | head -8 > notes.txt || true
          fi
          SIZE=$(stat -c%s "GoDoctor-$V.apk")
          SIZE32=$(stat -c%s "GoDoctor-$V-32bit.apk")
          BASE="https://github.com/$REPO/releases/download/v$V"
          # "apk" is the 64-bit one (what older app versions download);
          # "apks" lets the app pick the one for its phone.
          jq -n --arg v "$V" --argjson b "$BUILD" --argjson size "$SIZE" \
            --arg url "$BASE/GoDoctor-$V.apk" \
            --arg url32 "$BASE/GoDoctor-$V-32bit.apk" --argjson size32 "$SIZE32" \
            --rawfile notes notes.txt \
            '{version: $v, build: $b, apk: $url, size: $size,
              apks: {"arm64-v8a": {url: $url, size: $size},
                     "armeabi-v7a": {url: $url32, size: $size32}},
              notes: ($notes | split("\n") | map(select(length > 0)))}' > version.json
          cat version.json

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: GoDoctor ${{ steps.v.outputs.version }}
          files: |
            app/GoDoctor-${{ steps.v.outputs.version }}.apk
            app/GoDoctor-${{ steps.v.outputs.version }}-32bit.apk
            app/version.json
          generate_release_notes: true
          make_latest: true

      - name: Publish this version for iOS too (website.yml)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run website.yml --ref main -R "${{ github.repository }}"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f android/app/release.jks android/key.properties .env
